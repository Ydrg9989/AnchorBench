# AnchorBench root config. Compose with `--config-name` overrides or
# pick a recipe via `+experiment=paper_main`.
defaults:
  - data: external
  - model: qwen_7b
  - decoding: greedy
  - _self_

seed: 42
epsilon: 3.0
max_tokens: 512
batch_size: 32

results_root: results
out_dir: ${results_root}/${experiment_name}/${data.suite}/${model.slug}
experiment_name: scratch

hydra:
  run:
    dir: outputs/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: outputs/hydra/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
