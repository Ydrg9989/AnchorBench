# AnchorBench root config. Compose with `--config-name` overrides or
# pick a recipe via `+experiment=paper_main`.
defaults:
  - data: external
  - model: qwen_7b
  - decoding: greedy
  - _self_

seed: 42
batch_size: 32

results_root: results
# The run's root. Local runners write <out_dir>/<suite>/<slug>/, the API runner
# <out_dir>/<suite>/<slug>/ as well, and analysis.unified discovers that layout.
out_dir: ${results_root}/${experiment_name}
experiment_name: scratch

hydra:
  run:
    dir: outputs/hydra/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: outputs/hydra/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
