[project]
name = "anchorbench"
version = "2.0.0"
description = "AnchorBench: Measuring LLM Susceptibility to Numeric Anchoring Across Interface Paradigms"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "AnchorBench Authors"}]
readme = "README.md"
keywords = ["llm", "benchmark", "anchoring", "evaluation", "nlp"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "tqdm>=4.65",
    "torch>=2.1",
    "transformers>=4.36",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
]

[project.optional-dependencies]
vllm = ["vllm>=0.6.0"]
api = ["aiohttp>=3.9"]
dev = ["pytest>=7.0", "ruff>=0.4"]
all = ["anchorbench[vllm,api,dev]"]

[project.scripts]
anchorbench = "anchorbench.cli.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"anchorbench" = ["py.typed"]
"anchorbench.data" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    # Line length is not enforced. 99% of lines are already under 100, but the
    # ~250 that are not are mostly LaTeX string literals in the table builders,
    # where reflowing changes generated output for no correctness gain. There
    # is no autoformatter in this project to keep it consistent either.
    "E501",
    # zip(...) without an explicit strict=; the call sites pair sequences that
    # are constructed together and are known to be equal length.
    "B905",
]

[tool.ruff.lint.per-file-ignores]
# Package __init__ files re-export names as the public surface.
"__init__.py" = ["F401"]
