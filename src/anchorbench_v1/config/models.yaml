# Role-based model assignments for AnchorBench v1 dataset generation.
#
# WHY ROLE-BASED MODELS
#   Different generation tasks have different quality/cost trade-offs.
#   - bulk_writer: high throughput, moderate quality → cheap fast model
#   - template_author: high quality text → stronger model, lower temperature
#   - validator: deterministic judgments → frontier model, temperature 0
#
# HOW TO SWAP MODELS
#   Change the model_id under any role below. Use explicit OpenRouter model IDs
#   (e.g. "google/gemini-2.5-flash") — never use "latest" aliases.
#   Run `python -m anchorbench_v1.model_registry --check` to verify IDs are live.

roles:
  bulk_writer:
    model_id: "google/gemini-3-flash-preview"
    temperature: 0.7
    max_tokens: 2048
    description: "Fast model for generating bulk scenario / evidence text"

  template_author:
    model_id: "anthropic/claude-sonnet-4.6"
    temperature: 0.4
    max_tokens: 4096
    description: "High-quality model for authoring prompt templates"

  validator:
    model_id: "openai/gpt-5.2"
    temperature: 0.0
    max_tokens: 512
    description: "Frontier model for LLM-based spot-check validation"
