# AnchorBench benchmark configuration
# Central source of truth for dataset paths, model IDs, and defaults.

# ── Dataset paths (relative to repo root) ──────────────────────────
suite_datasets:
  external: datasets/anchorbench_external_core
  history:  datasets/anchorbench_history_core
  icl:      datasets/anchorbench_icl_core
  rag:      datasets/anchorbench_rag_core
  tool:     datasets/anchorbench_tool_core

variant_datasets:
  icl_dist: datasets/anchorbench_icl_dist_core

# ── Open-weight model IDs (HuggingFace Hub) ────────────────────────
ow_models:
  - Qwen/Qwen2.5-1.5B-Instruct
  - Qwen/Qwen2.5-3B-Instruct
  - Qwen/Qwen2.5-7B-Instruct
  - meta-llama/Llama-3.2-1B-Instruct
  - meta-llama/Llama-3.2-3B-Instruct
  - meta-llama/Llama-3.1-8B-Instruct
  - google/gemma-3-1b-it
  - google/gemma-3-4b-it
  - allenai/OLMo-2-1124-13B-Instruct
  - allenai/OLMo-2-0325-32B-Instruct

# ── API model IDs (OpenRouter) ─────────────────────────────────────
api_models:
  - openai/gpt-5.4-mini
  - anthropic/claude-haiku-4.5
  - google/gemini-2.5-flash
  - x-ai/grok-3-mini-beta

# ── Display names (model slug -> short name for tables/figures) ────
model_short_names:
  meta-llama_Llama-3.2-1B-Instruct: Llama-1B
  meta-llama_Llama-3.2-3B-Instruct: Llama-3B
  meta-llama_Llama-3.1-8B-Instruct: Llama-8B
  Qwen_Qwen2.5-1.5B-Instruct: Qwen-1.5B
  Qwen_Qwen2.5-3B-Instruct: Qwen-3B
  Qwen_Qwen2.5-7B-Instruct: Qwen-7B
  google_gemma-3-1b-it: Gemma-1B
  google_gemma-3-4b-it: Gemma-4B
  allenai_OLMo-2-1124-13B-Instruct: OLMo-13B
  allenai_OLMo-2-0325-32B-Instruct: OLMo-32B
  openai_gpt-4o-mini: GPT-4o-mini
  openai_gpt-5.4-mini: GPT-5.4-mini
  google_gemini-2.5-flash: Gemini-2.5-Flash
  anthropic_claude-haiku-4.5: Claude-H4.5
  x-ai_grok-3-mini-beta: Grok-3-mini

# ── Defaults ───────────────────────────────────────────────────────
defaults:
  seed: 42
  epsilon: 3.0
  max_tokens: 512
  batch_size: 32
  promptviews_file: promptviews_core.jsonl
  itemspecs_file: itemspecs.jsonl

# ── Model tiers (used by scripts/run.py for GPU scheduling) ────────
# Each tier lists models that share GPU configuration. The runner
# assigns one model per `gpu_ids` slot and runs each tier in parallel
# (within tier) and tiers sequentially (between tiers).
model_tiers:
  small_a:
    description: Small models (1B-3B) - 1 GPU each, run 4 in parallel
    tensor_parallel: 1
    gpu_ids: [0, 1, 2, 3]
    models:
      - Qwen/Qwen2.5-1.5B-Instruct
      - meta-llama/Llama-3.2-1B-Instruct
      - google/gemma-3-1b-it
      - Qwen/Qwen2.5-3B-Instruct
  small_b:
    description: Remaining small models
    tensor_parallel: 1
    gpu_ids: [0, 1]
    models:
      - meta-llama/Llama-3.2-3B-Instruct
      - google/gemma-3-4b-it
  medium:
    description: Medium models (7B-8B) - 1 GPU each, 2 in parallel
    tensor_parallel: 1
    gpu_ids: [0, 1]
    models:
      - Qwen/Qwen2.5-7B-Instruct
      - meta-llama/Llama-3.1-8B-Instruct
  large:
    description: Large model (13B) - 1 GPU, serial
    tensor_parallel: 1
    gpu_ids: [0]
    models:
      - allenai/OLMo-2-1124-13B-Instruct
  xlarge:
    description: 32B - tensor parallel across 4 GPUs
    tensor_parallel: 4
    gpu_ids: ["0,1,2,3"]
    models:
      - allenai/OLMo-2-0325-32B-Instruct
  api:
    description: OpenRouter API models - no GPU
    tensor_parallel: 0
    gpu_ids: []
    models:
      - openai/gpt-5.4-mini
      - anthropic/claude-haiku-4.5
      - google/gemini-2.5-flash
      - x-ai/grok-3-mini-beta

# ── Experiment recipes (named runs for `anchorbench experiment`) ───
# Each recipe is a fully-specified command bundle. Resolves to one or
# more per-suite/per-model invocations.
experiments:
  paper_main:
    description: 14-model x 5-suite main benchmark (greedy, eps=3, core size)
    suites: [external, history, icl, rag, tool]
    model_tiers: [small_a, small_b, medium, large, xlarge, api]
    decoding: {temperature: 0.0, max_tokens: 512}
    baseline_condition: control          # history uses control_twostage internally too
    out_dir: results/full_benchmark      # API runs override to results/api_benchmark
    api_out_dir: results/api_benchmark

  paper_icl_dist:
    description: ICL-dist variant (Table 14)
    suites: [icl]
    variant: icl_dist
    model_tiers: [small_a, small_b, medium, large, xlarge]
    decoding: {temperature: 0.0, max_tokens: 512}
    out_dir: results/icl_dist_core

  paper_history_matched:
    description: History matched-control follow-up (Table 13)
    suites: [history]
    model_tiers: [small_a, small_b, medium, large, xlarge]
    baseline_condition: control_twostage
    out_dir: results/history_matched

  paper_sampling:
    description: Sampling robustness sweep (5 seeds @ T=0.7) on Qwen-7B + Llama-8B
    suites: [external, rag, icl_dist]
    models:
      - Qwen/Qwen2.5-7B-Instruct
      - meta-llama/Llama-3.1-8B-Instruct
    decoding: {temperature: 0.7, max_tokens: 512, n_samples: 5}
    out_dir: results/revision/sampling_robustness

  paper_mitigation_headroom:
    description: Mitigation strategies on External + RAG for Qwen-7B + Llama-8B
    suites: [external, rag]
    models:
      - Qwen/Qwen2.5-7B-Instruct
      - meta-llama/Llama-3.1-8B-Instruct
    strategies: [baseline, ignore, self_check, cot]
    decoding: {temperature: 0.0, max_tokens: 512}
    out_dir: results/revision/mitigation_headroom

# ── Frozen paper run (pinned to git hash for byte-identical reproduction) ──
paper_run:
  experiment: paper_main
  git_hash: null                          # set during release; null = warn only
  dataset_size: core
  seeds: [42]
  expected_outputs:
    - results/full_benchmark/unified_all_suites.json
    - results/api_benchmark/unified_all_suites.json
    - COLM/figures/fig4_dose_response.pdf
    - COLM/figures/fig5_acc_vs_disc.pdf
    - outputs/tables/tab_main_results.tex
    - outputs/tables/tab_uai_pathway.tex
