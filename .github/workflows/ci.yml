name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the package
        # No torch, transformers or vLLM: they are the [hf] and [vllm]
        # extras, imported only inside the local backends, and nothing in
        # the test suite loads a model.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api,dev]"

      - name: Lint
        run: ruff check src tests scripts datasets

      - name: Test
        # Regenerates all six suites and checks them byte-for-byte against
        # the committed prompts and runs the parsing and metric unit tests.
        run: python -m pytest -q
