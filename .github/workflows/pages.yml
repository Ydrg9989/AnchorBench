# Publish the project page to GitHub Pages.
#
# GitHub's "deploy from a branch" option only offers the repository root or
# /docs, and docs/ here is developer documentation -- so the site in page/
# cannot be served that way. This workflow uploads page/ as the Pages artifact
# instead, which needs no renaming and no gh-pages branch.
#
# One-time setup: Settings -> Pages -> Source -> "GitHub Actions".
name: Deploy project page

on:
  push:
    branches:
      - main
      # Also deploy from the release branch, so the page is live before the
      # branch is merged. Remove once main carries it.
      - freeze/camera-ready-2026-08
    paths:
      - "page/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the page has no unresolved placeholders
        run: |
          if grep -qE 'PAPER_URL|GITHUB_URL|HF_DATASET_URL|OPENREVIEW_URL|PROJECT_PAGE_URL' page/index.html; then
            echo "::error::page/index.html still contains a placeholder URL"
            grep -nE 'PAPER_URL|GITHUB_URL|HF_DATASET_URL|OPENREVIEW_URL|PROJECT_PAGE_URL' page/index.html
            exit 1
          fi

      - name: Check every local asset referenced by the page exists
        run: |
          python3 - <<'PY'
          import re, sys, pathlib
          root = pathlib.Path("page")
          html = (root / "index.html").read_text()
          missing = [a for a in set(re.findall(r'(?:href|src)="((?!https?:|#|mailto:|data:)[^"]+)"', html))
                     if not (root / a.lstrip("./")).exists()]
          if missing:
              print("::error::missing assets: " + ", ".join(sorted(missing)))
              sys.exit(1)
          print(f"all {len(set(re.findall(r'(?:href|src)=', html)))} references resolve")
          PY

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: page

      - id: deployment
        uses: actions/deploy-pages@v4
